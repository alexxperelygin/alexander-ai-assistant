name: VPS ops

# «Пульт управления» сервером: запускается вручную (workflow_dispatch) с
# выбором задачи. Позволяет обслуживать VPS без захода в терминал:
#   status   — снять отчёт о состоянии → status/latest.md
#   update   — обновить код на сервере (installer) и снять отчёт
#   backtest — запустить backtest (24h и 6h) → status/backtest.md + отчёт
#   restart  — перезапустить сервисы pm2 и снять отчёт
#   diag     — снять нагрузку, диск и список процессов сервера (без отчёта)
# Требуются секреты VPS_HOST и VPS_SSH_PASSWORD (Settings → Secrets → Actions).
# Запуск доступен только пользователям с правом записи в репозиторий.

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Что сделать на сервере"
        required: true
        default: "status"
        type: choice
        options: [status, update, backtest, restart, domain, research, diag]
  # Альтернативный способ запуска (для интеграций без права actions:write):
  # закоммитить нужную задачу первой строкой в ops/command.txt.
  push:
    branches: [main]
    paths: ["ops/command.txt"]

permissions:
  contents: write

concurrency:
  group: vps-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    # Без явного предела GitHub ждёт 6 часов, а группа concurrency держит все
    # остальные задачи в очереди — одно зависание блокирует обслуживание
    # сервера на полдня. Успешный прогон укладывается в минуту-две; предел
    # рассчитан на самый долгий сценарий — backtest по двум горизонтам.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PASSWORD: ${{ secrets.VPS_SSH_PASSWORD }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_SSH_PASSWORD" ]; then
            echo "::error::Добавьте секреты VPS_HOST и VPS_SSH_PASSWORD в Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Resolve task
        id: task
        env:
          INPUT_TASK: ${{ inputs.task }}
        run: |
          if [ -n "$INPUT_TASK" ]; then
            TASK="$INPUT_TASK"
          else
            TASK=$(head -1 ops/command.txt 2>/dev/null | tr -cd 'a-z')
          fi
          case "$TASK" in status|update|backtest|restart|domain|research|diag) ;; *) TASK=status ;; esac
          echo "task=$TASK" >> "$GITHUB_OUTPUT"
          echo "Задача: $TASK"

      - name: Run task over SSH
        env:
          SSHPASS: ${{ secrets.VPS_SSH_PASSWORD }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          TASK: ${{ steps.task.outputs.task }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          NEYNAR_API_KEY: ${{ secrets.NEYNAR_API_KEY }}
        run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q sshpass >/dev/null
          # -n: ssh не забирает stdin шага. Локальный timeout: ConnectTimeout
          # ограничивает только установку соединения, а зависшая УЖЕ ЗАПУЩЕННАЯ
          # команда держит канал сколько угодно — 19 августа так сгорел весь
          # 20-минутный бюджет задачи, и шаг не напечатал ни строки.
          run_ssh() {
            timeout "${SSH_TIMEOUT:-900}" sshpass -e ssh -n \
              -o StrictHostKeyChecking=no -o ConnectTimeout=15 "root@$VPS_HOST" "$1"
          }
          mkdir -p status

          case "$TASK" in
            update)
              echo "== Обновление кода на сервере =="
              # Установщик собирает Next.js и применяет схему; построение
              # индекса на базе в 1.6 ГБ добавляет к этому минуты. Предел по
              # умолчанию (900 с) для такой задачи мал, но остаётся ниже
              # 30-минутного лимита самого прогона.
              SSH_TIMEOUT=1500
              # Платный ключ X передаётся по stdin в файл с режимом 600.
              # Не через аргументы команды: они видны в списке процессов сервера.
              send_secret() { # $1 = значение, $2 = имя файла на сервере
                [ -n "$1" ] || return 0
                printf '%s' "$1" | sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 "root@$VPS_HOST" \
                  "install -d -m 700 /opt/memescope-secrets && cat > /opt/memescope-secrets/$2 && chmod 600 /opt/memescope-secrets/$2"
                echo "Секрет $2 передан на сервер (значение не печатается)."
              }
              send_secret "${X_BEARER_TOKEN:-}" x_bearer
              send_secret "${REDDIT_CLIENT_ID:-}" reddit_client_id
              send_secret "${REDDIT_CLIENT_SECRET:-}" reddit_client_secret
              send_secret "${NEYNAR_API_KEY:-}" neynar_api_key
              # ВАЖНО: без пайпа сразу за ssh — `| tail` маскировал код ошибки,
              # и провалившиеся деплои выглядели успешными.
              if ! run_ssh 'git -C /opt/alexander-ai-assistant fetch -q origin main && git -C /opt/alexander-ai-assistant reset -q --hard origin/main && bash /opt/alexander-ai-assistant/memescope/deploy/install.sh' > /tmp/update.log 2>&1; then
                tail -60 /tmp/update.log
                echo "::error::Установщик на сервере завершился с ошибкой"
                exit 1
              fi
              tail -40 /tmp/update.log
              grep -q "ГОТОВО" /tmp/update.log || { echo "::error::Маркер ГОТОВО не найден — установка не дошла до конца"; exit 1; }
              unset SSH_TIMEOUT
              ;;
            backtest)
              echo "== Backtest 24h и 6h =="
              # Вывод расчёта уходит в файл НА СЕРВЕРЕ, а не в ssh-канал. Если
              # timeout убьёт расчёт, уцелевший потомок больше не удерживает
              # канал открытым: ssh закрывается сразу после `cat`.
              # `setsid` отвязывает расчёт от терминала сессии, -s KILL добивает
              # зависший процесс, чтобы он не остался жить на общем VPS.
              BT_LIMIT=600
              SSH_TIMEOUT=$((BT_LIMIT + 120))
              bt() { # $1 = горизонт
                local started rc
                started=$(date +%s)
                # Шаг идёт под `bash -e`: без if провал ssh оборвал бы весь шаг,
                # и отчёт остался бы обрезанным на середине.
                if run_ssh "cd /opt/alexander-ai-assistant/memescope && \
                  setsid timeout -s KILL $BT_LIMIT npx tsx src/lib/backtest/cli.ts \
                    --horizon $1 --mode live > /tmp/bt-$1.log 2>&1 </dev/null; \
                  echo \"exit=\$?\" >> /tmp/bt-$1.log; cat /tmp/bt-$1.log"
                then rc=0; else rc=$?; fi
                echo ""
                # Время расчёта пишется в отчёт всегда: без него нельзя отличить
                # «стратегия не считается» от «расчёт просто не успел».
                echo "_Расчёт занял $(( $(date +%s) - started )) с при лимите ${BT_LIMIT} с; код ssh $rc._"
              }
              {
                echo "# Backtest ($(date -u +%FT%TZ))"
                echo ""
                echo "## Горизонт 24h"
                bt 24h
                echo ""
                echo "## Горизонт 6h"
                bt 6h
              } > status/backtest.md
              unset SSH_TIMEOUT
              cat status/backtest.md
              ;;
            restart)
              echo "== Перезапуск сервисов =="
              run_ssh 'pm2 restart memescope-web memescope-worker && pm2 status'
              ;;
            domain)
              echo "== Подключение домена =="
              if ! run_ssh 'git -C /opt/alexander-ai-assistant pull -q origin main; bash /opt/alexander-ai-assistant/memescope/deploy/setup-domain.sh' > /tmp/domain.log 2>&1; then
                tail -40 /tmp/domain.log
                echo "::error::Подключение домена не завершилось"
                exit 1
              fi
              tail -30 /tmp/domain.log
              grep -q "DOMAIN ГОТОВО" /tmp/domain.log || { echo "::error::Маркер DOMAIN ГОТОВО не найден"; exit 1; }
              ;;
            research)
              echo "== Исследование edge =="
              if ! run_ssh 'git -C /opt/alexander-ai-assistant pull -q origin main; cd /opt/alexander-ai-assistant/memescope && NODE_OPTIONS=--max-old-space-size=1200 npx tsx deploy/research.mts' > status/research.md 2>/tmp/research.err; then
                tail -30 /tmp/research.err
                echo "::error::Исследование не завершилось"
                exit 1
              fi
              head -60 status/research.md
              ;;
            diag)
              # Отчёт status.mts 19 августа стал занимать более получаса вместо
              # минуты. Ни один существующий вывод не отвечает на вопрос «что
              # именно тормозит», поэтому здесь снимается сырое состояние
              # машины. Задача только читает — ничего не запускает и не чинит.
              echo "== Диагностика сервера =="
              SSH_TIMEOUT=120
              run_ssh 'echo "-- нагрузка --"; uptime;
                echo; echo "-- память (МБ) --"; free -m | head -2;
                echo; echo "-- диск --"; df -h / | tail -1;
                echo; echo "-- 8 процессов по CPU --";
                ps -eo pid,etime,pcpu,pmem,comm --sort=-pcpu | head -9;
                echo; echo "-- node/tsx проекта --";
                ps -eo pid,etime,pcpu,args | grep -E "tsx|node" | grep -v grep | head -20;
                echo; echo "-- база --";
                ls -lh /opt/alexander-ai-assistant/memescope/prisma/ 2>/dev/null;
                echo; echo "-- источник цен, запрос С САМОГО СЕРВЕРА --";
                echo "WETH на base (эталон, пары есть всегда):";
                curl -fsS --max-time 20 -H "accept: application/json" \
                  -H "user-agent: memescope-ai-research/0.1" \
                  "https://api.dexscreener.com/latest/dex/tokens/0x4200000000000000000000000000000000000006" \
                  | head -c 400; echo;
                echo "он же без нашего user-agent:";
                curl -fsS --max-time 20 -H "accept: application/json" \
                  "https://api.dexscreener.com/latest/dex/tokens/0x4200000000000000000000000000000000000006" \
                  | head -c 400; echo' \
                || echo "::warning::Диагностика не снялась полностью"
              unset SSH_TIMEOUT
              ;;
            status) ;; # только отчёт ниже
          esac

          if [ "$TASK" = "diag" ]; then
            echo "== Отчёт не снимается: задача diag только читает состояние =="
            exit 0
          fi

          echo "== Снимаю отчёт =="
          # `git pull` на сервере ходит в сеть без ограничения по времени —
          # недоступный GitHub подвесил бы шаг целиком, а `|| true` от этого
          # не спасает: он ловит код возврата, а не зависание.
          # Сам отчёт пишется в файл НА СЕРВЕРЕ по той же причине, что и
          # backtest: убитый по таймауту процесс не должен держать ssh-канал.
          REPORT_LIMIT=600
          SSH_TIMEOUT=$((REPORT_LIMIT + 120))
          started=$(date +%s)
          if run_ssh "GIT_TERMINAL_PROMPT=0 timeout 60 git -C /opt/alexander-ai-assistant pull -q origin main >/dev/null 2>&1 || true; \
            cd /opt/alexander-ai-assistant/memescope && \
            setsid timeout -s KILL $REPORT_LIMIT npx tsx deploy/status.mts > /tmp/status.md 2>/tmp/status.err </dev/null; \
            cat /tmp/status.md" > /tmp/latest.md
          then rc=0; else rc=$?; fi
          echo "Отчёт снят за $(( $(date +%s) - started )) с (лимит ${REPORT_LIMIT} с), код ssh $rc."
          unset SSH_TIMEOUT

          # Пустой или обрезанный отчёт не должен заменять прежний: иначе
          # единственный источник правды о сервере теряется ровно в тот момент,
          # когда с сервером что-то не так.
          if [ "$rc" -ne 0 ] || ! grep -q "^# MemeScope AI" /tmp/latest.md; then
            echo "::error::Отчёт не снялся (код $rc, $(wc -c < /tmp/latest.md) байт) — прежний status/latest.md сохранён"
            head -20 /tmp/latest.md
            exit 1
          fi
          mv /tmp/latest.md status/latest.md
          cat status/latest.md

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Отчёты — сгенерированные артефакты, а не правки, которые надо
          # сливать. Прежний `git pull --rebase` пытался слить свою версию
          # status/latest.md с чужой и падал конфликтом, когда два прогона шли
          # подряд: 14 августа так потерялся отчёт, снятый специально в момент
          # сбоя. Правильная стратегия здесь — «последний перезаписывает».
          #
          # reset --mixed переносит базу на свежий main, НЕ трогая рабочее
          # дерево: только что сгенерированные файлы остаются на месте и
          # добавляются уже поверх актуального состояния. Конфликт при этом
          # невозможен в принципе, а push всегда fast-forward.
          git fetch -q origin main
          git reset -q --mixed origin/main
          git add status/
          git commit -m "status: ${{ steps.task.outputs.task }} report [skip ci]" || echo "нет изменений"
          git push
