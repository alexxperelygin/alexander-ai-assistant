name: Capital OS cycle

# Еженедельный цикл агента: тесты → расчёт → план → отчёт в status/capital-os.md.
# Расписание GitHub исполняет только из основной ветки. Вручную — кнопкой Run workflow.
# Секрет ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions) включает слой
# рассуждения; без него цикл проходит детерминированно и так и пишет в отчёте.

on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: capital-os
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: capital-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Run cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m capital_os cycle --n 200000
      - name: Commit report
        working-directory: .
        run: |
          git config user.name "capital-os"
          git config user.email "capital-os@users.noreply.github.com"
          git add status/capital-os.md capital-os/state/journal.jsonl
          git diff --cached --quiet || git commit -m "status: capital-os cycle [skip ci]"
          git push
